# pre-commit フック設定 (python/ の設定を上書きする)
# 使い方: uv run pre-commit install --hook-type pre-commit --hook-type pre-push
#
# pre-commit に設定の include/extends は無いため、python/.pre-commit-config.yaml を
# 全文複製したうえで、末尾へ C/C++ 固有のフックを足している。
# python/ 側を変更したら、このファイルの「C/C++ 固有」より前を丸ごと置き換えること。
default_stages: [pre-commit]

repos:
    # シークレット混入の検出
    - repo: https://github.com/gitleaks/gitleaks
      rev: v8.30.1
      hooks:
          - id: gitleaks

    # コードフォーマッター (Prettier)
    - repo: https://github.com/pre-commit/mirrors-prettier
      # mirrors-prettier はアーカイブ済みで v4.0.0-alpha.8 が最終版。
      # 動作しなくなった時点で local フック (node 実行) へ切り替える
      rev: v4.0.0-alpha.8
      hooks:
          - id: prettier
            types_or: [markdown, json, yaml, toml]
            additional_dependencies:
                ["prettier@3.9.6", "prettier-plugin-toml@2.0.6"]
            # Prettier 3 はプラグインを自動読み込みしないため明示する。
            # 共有の .prettierrc ではなくここで渡すのは、node_modules を持たない
            # リポジトリでエディタ側の Prettier がプラグインを解決できず全体が壊れるため
            args: [--write, --plugin=prettier-plugin-toml]

    # Pythonコードフォーマッター・リンター (Ruff)
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.5
      hooks:
          - id: ruff-check
            args: [--fix]
          - id: ruff-format

    # Markdownリント
    - repo: https://github.com/DavidAnson/markdownlint-cli2
      rev: v0.23.2
      hooks:
          - id: markdownlint-cli2

    # 一般的な誤りの検出・修正
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
            args: [--markdown-linebreak-ext=md]
          - id: end-of-file-fixer
          - id: mixed-line-ending
            args: [--fix=lf]
          - id: check-merge-conflict
          - id: check-yaml
          - id: check-added-large-files

    # リポジトリ全体を見る検査 (push 時)
    # pre-commit の隔離環境ではプロジェクトの依存を解決できないため、
    # uv の仮想環境をそのまま使う local フックとして実行する。
    # types で絞ると Python ファイルを含まない push でスキップされるため always_run にする
    - repo: local
      hooks:
          - id: pyright
            name: pyright (型検査)
            entry: uv run pyright
            language: system
            always_run: true
            pass_filenames: false
            stages: [pre-push]

          # テストを書いたら有効化する
          # - id: pytest
          #   name: pytest
          #   entry: uv run pytest
          #   language: system
          #   always_run: true
          #   pass_filenames: false
          #   stages: [pre-push]

    # ------------------------------------------------------------------
    # ここから C/C++ 固有。python/ には存在しない部分
    # ------------------------------------------------------------------

    # C++コードフォーマッター (Clang-Format)
    - repo: https://github.com/pre-commit/mirrors-clang-format
      rev: v23.1.0
      hooks:
          - id: clang-format
            types_or: [c++, c, cuda]
            args: [-style=file]

    # CMakeコードフォーマッター
    - repo: https://github.com/cheshirekow/cmake-format-precommit
      rev: v0.6.13
      hooks:
          - id: cmake-format
            additional_dependencies: [pyyaml]

    # ---- c レイヤの追加フック (展開時に追記した部分) ----

    # C++コードフォーマッター (Clang-Format)
    - repo: https://github.com/pre-commit/mirrors-clang-format
      rev: v23.1.0
      hooks:
          - id: clang-format
            types_or: [c++, c, cuda]
            args: [-style=file]

    # CMakeコードフォーマッター
    - repo: https://github.com/cheshirekow/cmake-format-precommit
      rev: v0.6.13
      hooks:
          - id: cmake-format
            additional_dependencies: [pyyaml]

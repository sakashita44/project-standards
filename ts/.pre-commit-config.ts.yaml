    # ---- ts レイヤの追加フック (展開時に追記した部分) ----

    # TypeScript の整形とリント、およびリポジトリ全体を見る検査 (push 時)
    # pre-commit の隔離環境ではプロジェクトの依存を解決できないため、
    # npm の依存をそのまま使う local フックとして実行する。
    # eslint の設定はプロジェクト直下から typescript-eslint を解決する
    - repo: local
      hooks:
          - id: prettier-ts
            name: prettier (TypeScript)
            entry: npx prettier --write
            language: system
            files: \.(ts|tsx)$

          - id: eslint
            name: eslint
            entry: npx eslint --fix
            language: system
            files: \.(ts|tsx)$

          # types で絞ると TypeScript ファイルを含まない push でスキップされるため always_run にする
          - id: typecheck
            name: tsc --noEmit (型検査)
            entry: npm run typecheck
            language: system
            always_run: true
            pass_filenames: false
            stages: [pre-push]

          # テストを書いたら有効化する
          # - id: test
          #   name: vitest
          #   entry: npm test
          #   language: system
          #   always_run: true
          #   pass_filenames: false
          #   stages: [pre-push]

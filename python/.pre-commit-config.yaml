# pre-commit フック設定
# 使い方: uv run pre-commit install --hook-type pre-commit --hook-type pre-push
default_stages: [pre-commit]

repos:
    # コードフォーマッター (Prettier)
    - repo: https://github.com/pre-commit/mirrors-prettier
      # mirrors-prettier はアーカイブ済みで v4.0.0-alpha.8 が最終版。
      # 動作しなくなった時点で local フック (node 実行) へ切り替える
      rev: v4.0.0-alpha.8
      hooks:
          - id: prettier
            types_or: [markdown, json, yaml, toml]
            additional_dependencies:
                ["prettier@3.4.2", "prettier-plugin-toml@2.0.1"]
            args:
                [
                    --write,
                    --config=.config/.prettierrc,
                    --ignore-path=.config/.prettierignore,
                ]

    # Pythonコードフォーマッター・リンター (Ruff)
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.5
      hooks:
          - id: ruff-check
            args: [--fix, --config=.config/ruff.toml]
          - id: ruff-format
            args: [--config=.config/ruff.toml]

    # Markdownリント
    - repo: https://github.com/DavidAnson/markdownlint-cli2
      rev: v0.23.2
      hooks:
          - id: markdownlint-cli2
            args: [--config, .config/.markdownlint.jsonc]

    # 末尾空白・ファイル末尾改行の修正
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
            args: [--markdown-linebreak-ext=md]
          - id: end-of-file-fixer
          - id: mixed-line-ending
            args: [--fix=lf]

    # リポジトリ全体を見る検査 (push 時)
    # pre-commit の隔離環境ではプロジェクトの依存を解決できないため、
    # リポジトリ全体を見る検査 (push 時)
    # pre-commit の隔離環境ではプロジェクトの依存を解決できないため、
    # uv の仮想環境をそのまま使う local フックとして実行する。
    # types で絞ると Python ファイルを含まない push でスキップされるため always_run にする
    - repo: local
      hooks:
          - id: pyright
            name: pyright (型検査)
            entry: uv run pyright
            language: system
            always_run: true
            pass_filenames: false
            stages: [pre-push]

          # テストを書いたら有効化する
          # - id: pytest
          #   name: pytest
          #   entry: uv run pytest
          #   language: system
          #   always_run: true
          #   pass_filenames: false
          #   stages: [pre-push]

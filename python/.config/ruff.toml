target-version = "py313"
line-length = 88

[lint]
select = [
    "E",   # pycodestyle エラー
    "W",   # pycodestyle 警告
    "F",   # Pyflakes
    "I",   # isort (import 順)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # 行長は ruff-format が整える
    # 以下はインデント整形に関する規則で、ruff-format と競合する。
    # W191 は実際に発火し、ruff-format が直す内容でリントが先に止まる
    "W191", # タブインデント
    "E111", # インデント幅が 4 の倍数でない
    "E114", # コメント行のインデント幅が 4 の倍数でない
    "E117", # 過剰なインデント
]

# pre-commit フック設定
# 使い方: uvx pre-commit install --hook-type pre-commit --hook-type pre-push
#
# 実装言語に依らず全リポジトリが持つ共通の品質ゲート。
# 言語別レイヤは自身の追加フックをこのファイルの末尾へ追記する
default_stages: [pre-commit]

repos:
    # シークレット混入の検出
    - repo: https://github.com/gitleaks/gitleaks
      rev: v8.30.1
      hooks:
          - id: gitleaks

    # コードフォーマッター (Prettier)
    - repo: https://github.com/pre-commit/mirrors-prettier
      # mirrors-prettier はアーカイブ済みで v4.0.0-alpha.8 が最終版。
      # 動作しなくなった時点で local フック (node 実行) へ切り替える
      rev: v4.0.0-alpha.8
      hooks:
          - id: prettier
            # toml は対象外。prettier はプラグインを対象ファイル側から解決するため、
            # pre-commit の隔離環境へ入れた prettier-plugin-toml を読み込めない
            types_or: [markdown, json, yaml]
            additional_dependencies: ['prettier@3.9.6']
            args: [--write]

    # Markdownリント
    - repo: https://github.com/DavidAnson/markdownlint-cli2
      rev: v0.23.2
      hooks:
          - id: markdownlint-cli2

    # 一般的な誤りの検出・修正
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
            args: [--markdown-linebreak-ext=md]
          - id: end-of-file-fixer
          - id: mixed-line-ending
            args: [--fix=lf]
          - id: check-merge-conflict
          - id: check-yaml
          - id: check-added-large-files

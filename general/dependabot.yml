# Dependabot 設定
# 展開先では .github/dependabot.yml に配置する

version: 2
updates:
    # GitHub Actions は全リポジトリ共通で有効化する
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"

    # npm を使用するリポジトリ（ts/ 系）ではコメントアウトを解除する
    # - package-ecosystem: "npm"
    #   directory: "/"
    #   schedule:
    #       interval: "weekly"

    # uv を使用するリポジトリ（python/, c/ 系）ではコメントアウトを解除する
    # - package-ecosystem: "uv"
    #   directory: "/"
    #   schedule:
    #       interval: "weekly"
